group = "com.tanacom.otp_autofill_sms"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.3.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"


android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.tanacom.otp_autofill_sms"
    }

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"


    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
//        implementation files('src/main/libs/flutter.jar')
        implementation 'com.google.android.gms:play-services-auth:21.5.1'
        implementation 'com.google.android.gms:play-services-auth-api-phone:18.3.0'
        implementation "androidx.core:core-ktx:1.17.0"
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.22.0")

    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
